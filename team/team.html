<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipe | Grupo de Pesquisa</title>
    <style>
        /* Estilos da Estrutura (Padrão do Site) */
        body {
            margin: 0; padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex; justify-content: center;
        }

        .page-wrapper {
            width: 100%; max-width: 1100px;
            background-color: #ffffff;
            min-height: 100vh;
            border-left: 1px solid #ccc; border-right: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* Estilos Específicos da Página de Membros */
        main { padding: 40px; font-family: "Times New Roman", Times, serif; }

        .institution-section { margin-bottom: 50px; }

        .institution-title {
            color: #1a2a44;
            font-size: 2rem; 
            border-bottom: 2px solid #f39c12; 
            padding-bottom: 10px;
            margin-bottom: 30px;
            text-align: left;
        }

        /* Grid de Membros */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 30px;
            text-align: center;
        }

        .member-card img {
            width: 150px;
            height: 180px;
            object-fit: cover; 
            border: 1px solid #ddd;
            margin-bottom: 10px;
        }

        .member-info h3 { margin: 5px 0; font-size: 1.2rem; }
        .member-info p { margin: 2px 0; font-size: 1rem; color: #555; }
        .role { font-weight: bold; color: #333; }

        .lattes-link { text-decoration: none; color: #1a2a44; }
        .lattes-link:hover { text-decoration: underline; color: #3182ce; }
    </style>
</head>
<body>

<div class="page-wrapper">
    <div id="header-placeholder"></div>

    <main>
        <h2 style="text-align: center; font-size: 2.5rem; color: #1a2a44; margin-bottom: 40px;">Equipe do Projeto</h2>

        <section class="institution-section">
            <h2 class="institution-title">Observatório Nacional (ON)</h2>
            <div class="team-grid">
                
                <div class="member-card">
                    <img src="https://servicosweb.cnpq.br/wspessoa/servletrecuperafoto?tipo=1&id=2331088061589222" alt="Julio Camargo">
                    <div class="member-info">
                        <h3>
                            <a href="https://lattes.cnpq.br/2331088061589222" target="_blank" rel="noopener" class="lattes-link">
                                Dr. Julio Ignacio Bueno de Camargo
                            </a>
                        </h3>
                        <p class="role">Professor</p>
                        <p><a href="mailto:camargo@on.br" style="text-decoration:none; color:#555;">camargo@on.br</a></p>
                    </div>
                </div>

                <div class="member-card">
                    <img src="../img/team/giuliano.jpg" alt="Giuliano Margoti">
                    <div class="member-info">
                        <h3>
                            <a href="URL_SEU_LATTES" target="_blank" rel="noopener" class="lattes-link">
                                Ms. Giuliano Margoti
                            </a>
                        </h3>
                        <p class="role">Doutorando</p>
                        <p>margoti@on.br</p>
                    </div>
                </div>

                </div>
        </section>
    </main>
</div>

<script>
    // Usamos o caminho absoluto "/" para garantir que ele ache o arquivo na raiz
    fetch('/header.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('header-placeholder').innerHTML = data;
        })
        .catch(error => console.error('Erro ao carregar o cabeçalho:', error));
</script>

</body>
</html>
