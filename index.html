<!DOCTYPE html>

            justify-content: center;
        }

        /* Conteiner Principal */
        .page-wrapper {
            width: 100%;
            max-width: 1100px; 
            background-color: #ffffff; 
            min-height: 100vh;
            box-shadow: 0 0 10px rgba(0,0,0,0.1); 
            border-left: 1px solid #ccc;
            border-right: 1px solid #ccc;
        }

        /* Cabeçalho superior */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px; 
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            height: 80px;
            width: auto;
        }

        .group-title h1 {

            margin: 0;
            color: #000;

        }

        /* Barra de Navegação */

            border-bottom: 4px solid #f39c12; /* Detalhe em dourado/albedo */
        }

        nav ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            flex: 1;
            border-right: 1px solid rgba(255, 255, 255, 0.2); /* Borda entre abas */
        }

        nav ul li:last-child {
            border-right: none;
        }

        nav ul li a {
            display: block;
            text-align: center;
            padding: 14px 0;
            text-decoration: none;
            color: #ffffff;
            font-size: 1.1rem;
            transition: background 0.3s;
        }

        nav ul li a:hover {
            background-color: #2c3e50;
        }

        /* Conteúdo */
        main {
            padding: 50px 80px; /* laterais do texto */
            text-align: justify;
            line-height: 1.6;
            color: #333;
        }

        h2 {
            text-align: left; 
            color: #1a2a44;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

</head>
