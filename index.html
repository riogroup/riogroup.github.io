            border-right: 1px solid #ccc;

            border-top: 1px solid #0d1522;
            border-bottom: 1px solid #f39c12;
        }

        nav ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            flex: 1;
            border-right: 1px solid #fff;
        }

        nav ul li:last-child {
            border-right: none;
        }

        nav ul li a {
            display: block;
            text-align: center;
            padding: 10px 0;
            text-decoration: none;
            color: #ffffff;
            font-size: 1.1rem;
        }

        nav ul li a:hover {
            background-color: #2c3e50;
        }

        /* Conteúdo */
        main {
            padding: 40px;
            text-align: justify;
            line-height: 1.5;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }
